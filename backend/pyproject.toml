[project]
name = "leave-planner-backend"
version = "0.1.0"
description = "Local consultant annual leave planning API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "alembic>=1.16",
    "httpx2>=2.9.1",
    "hypothesis>=6.165.2",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --strict-config --cov=src --cov-config=pyproject.toml --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
