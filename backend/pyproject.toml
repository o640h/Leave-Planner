[project]
name = "leave-planner-backend"
version = "0.2.0"
description = "Hosted consultant annual leave planning API"
readme = "README.md"
requires-python = ">=3.14.7,<3.15"
dependencies = [
    "alembic>=1.16",
    "argon2-cffi>=25.1,<26",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.14.2",
    "reportlab>=5.0.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "hypothesis>=6.165.2",
    "mypy>=2.3.0",
    "pypdf>=6.16.1",
    "pyright==1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6,<7",
    "ruff>=0.16.1",
    "types-pyyaml>=6,<7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --strict-config --cov=src --cov-config=pyproject.toml --cov-report=term-missing --cov-fail-under=85"
filterwarnings = ["error"]
markers = [
    "sqlite_only: exercises the legacy local SQLite backup or default-path behavior",
]

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "migrations"]
