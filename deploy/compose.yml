name: leave-planner

x-application-runtime: &application-runtime
  image: leave-planner:0.2.0
  environment:
    LEAVE_PLANNER_ENVIRONMENT: production
    LEAVE_PLANNER_LOG_LEVEL: INFO
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  mem_limit: 512m
  networks:
    - database_network
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  database:
    image: postgres:17.10-alpine3.24
    environment:
      POSTGRES_DB: leave_planner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - postgres_superuser_password
      - migration_database_password
      - application_database_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-database.sh:/docker-entrypoint-initdb.d/10-leave-planner.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leave_planner"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    shm_size: 128m
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    networks:
      - database_network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    <<: *application-runtime
    command: ["python", "-m", "migrations", "upgrade"]
    environment:
      LEAVE_PLANNER_ENVIRONMENT: production
      LEAVE_PLANNER_LOG_LEVEL: INFO
      LEAVE_PLANNER_DATABASE_URL_FILE: /run/secrets/migration_database_url
    secrets:
      - migration_database_url
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  application:
    <<: *application-runtime
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_VERSION: "0.2.0"
    environment:
      LEAVE_PLANNER_ENVIRONMENT: production
      LEAVE_PLANNER_LOG_LEVEL: INFO
      LEAVE_PLANNER_DATABASE_URL_FILE: /run/secrets/application_database_url
    secrets:
      - application_database_url
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    ports:
      - "${LEAVE_PLANNER_BIND_ADDRESS:-0.0.0.0}:${LEAVE_PLANNER_HTTP_PORT:-8080}:8000"
    networks:
      - database_network
      - edge_network

networks:
  database_network:
    driver: bridge
    internal: true
  edge_network:
    driver: bridge

volumes:
  postgres_data:

secrets:
  postgres_superuser_password:
    file: ./secrets/postgres_superuser_password.txt
  migration_database_password:
    file: ./secrets/migration_database_password.txt
  application_database_password:
    file: ./secrets/application_database_password.txt
  migration_database_url:
    file: ./secrets/migration_database_url.txt
  application_database_url:
    file: ./secrets/application_database_url.txt
